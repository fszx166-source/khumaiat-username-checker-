<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خميعات لليوزرات</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b0a;color:#f3fff7;font-family:Arial,sans-serif;padding:20px}
main{max-width:650px;margin:35px auto;background:#101613;border:1px solid #21452f;border-radius:18px;padding:22px}
h1{color:#36f28b;text-align:center;font-size:30px}
p{text-align:center;color:#a8b8ae}
label{display:block;margin:20px 0 8px}
input,select,textarea,button{width:100%;padding:13px;border-radius:10px;font-size:16px}
input,select,textarea{background:#080d0a;color:white;border:1px solid #345541}
button{background:#24d879;color:#04170b;border:0;font-weight:bold;margin-top:12px;cursor:pointer}
button:disabled{opacity:.5}
#results{margin-top:18px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:2}
.small{font-size:13px;color:#82958a}
</style>
</head>
<body>
<main>
<h1>خميعات لليوزرات</h1>
<p>مولّد يوزرات تيك توك — واجهة تجريبية</p>
<label for="amount">عدد اليوزرات</label>
<select id="amount">
<option value="5">5 يوزرات</option>
<option value="10">10 يوزرات</option>
<option value="20">20 يوزر</option>
</select>
<label for="pattern">نوع اليوزر</label>
<select id="pattern">
<option value="mixed">حروف وأرقام</option>
<option value="letters">حروف فقط</option>
<option value="digits">حروف مع أرقام ونقطة</option>
</select>
<button id="generate">توليد يوزرات</button>
<textarea id="results" rows="10" placeholder="اليوزرات بتظهر هنا..." readonly></textarea>
<button id="copy">نسخ اليوزرات</button>
<p class="small">تنبيه: التوليد لا يعني أن اليوزر متاح. يلزم ربط الواجهة بفاحص يعمل من الخادم للتحقق من التوفر.</p>
</main>
<script>
const chars="abcdefghijklmnopqrstuvwxyz";
const nums="0123456789";
function randomChar(s){return s[Math.floor(Math.random()*s.length)]}
function makeUsername(type){
 let out="";
 const len= Math.random()<0.5?4:3:2;
 for(let i=0;i<len;i++){
   let pool=chars;
   if(type==="mixed") pool=chars+nums;
   if(type==="digits") pool=chars+nums+".";
   out+=randomChar(pool);
 }
 return out;
}
document.getElementById("generate").addEventListener("click",()=>{
 const amount=Number(document.getElementById("amount").value);
 const type=document.getElementById("pattern").value;
 const names=new Set();
 while(names.size<amount) names.add(makeUsername(type));
 document.getElementById("results").value=[...names].map(x=>"@"+x).join("\n");
});
document.getElementById("copy").addEventListener("click",async()=>{
 const box=document.getElementById("results");
 if(!box.value){alert("ولّد اليوزرات أولاً");return;}
 try{await navigator.clipboard.writeText(box.value);alert("تم نسخ اليوزرات");}
 catch(e){box.focus();box.select();alert("حدد النص وانسخه");}
});
</script>
</body>
</html>
